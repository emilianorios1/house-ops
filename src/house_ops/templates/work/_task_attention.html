{% load house_ops %}
<article class="card attention-card shadow-sm">
  <div class="card-body d-flex align-items-center justify-content-between gap-3">
    <div>
      <span class="badge {% if state == 'Vencida' %}text-bg-danger{% else %}text-bg-primary{% endif %} mb-1">{{ state }}</span>
      <h3 class="h5 mb-1">{{ task.title }}</h3>
      <small class="text-body-secondary">{{ task.assigned_to|default:"Sin asignar" }} · {{ task.due_date|date_ar }}</small>
    </div>
    <form method="post" action="{% url 'work:task_transition' task.id 'done' %}" hx-post="{% url 'work:task_transition' task.id 'done' %}" hx-target="#attention-panel" hx-swap="outerHTML">
      {% csrf_token %}<input type="hidden" name="from_home" value="1">
      <button class="btn btn-success touch-target" type="submit">Completar</button>
    </form>
  </div>
</article>
