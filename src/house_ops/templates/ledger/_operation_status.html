<article id="operation-{{ run.id }}" class="card border-0 shadow-sm" {% if run.status == 'queued' or run.status == 'running' %}hx-get="{% url 'ledger:operation_status' run.id %}" hx-trigger="every 2s" hx-swap="outerHTML"{% endif %}><div class="card-body py-2"><div class="d-flex justify-content-between align-items-center gap-2"><div><strong>{{ run.action }}</strong><div class="small text-body-secondary">{{ run.requested_by|default:"Usuario eliminado" }} · {{ run.requested_at|date:"d/m H:i" }}</div>{% if run.message %}<div class="small">{{ run.message }}</div>{% endif %}</div><span class="badge {% if run.status == 'succeeded' %}text-bg-success{% elif run.status == 'failed' %}text-bg-danger{% elif run.status == 'running' %}text-bg-primary{% else %}text-bg-secondary{% endif %}">{{ run.get_status_display }}</span></div>{% if run.log %}<details class="mt-2" {% if run.status == 'running' or run.status == 'failed' %}open{% endif %}><summary class="small fw-semibold">Ver logs</summary><pre class="small parsed-json bg-body-tertiary rounded p-2 mt-2 mb-0">{{ run.log }}</pre></details>{% endif %}</div></article>
