{% extends "base.html" %}
{% block title %}Ingresar · House Ops{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center login-row">
  <div class="col-12 col-sm-9 col-md-6 col-lg-4">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-2">Ingresar a House Ops</h1>
        <p class="text-body-secondary">Todo lo que necesita atención en casa.</p>
        {% if form.errors %}<div class="alert alert-danger">Usuario o contraseña incorrectos.</div>{% endif %}
        <form method="post" class="vstack gap-3">
          {% csrf_token %}
          <div>
            <label class="form-label" for="id_username">Usuario</label>
            <input class="form-control form-control-lg" id="id_username" name="username" autocomplete="username" required autofocus>
          </div>
          <div>
            <label class="form-label" for="id_password">Contraseña</label>
            <input class="form-control form-control-lg" id="id_password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary btn-lg touch-target" type="submit">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
