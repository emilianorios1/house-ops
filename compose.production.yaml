name: home-lab-prod
x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  AUTH_SECRET: ${AUTH_SECRET:-${HOUSE_OPS_SECRET_KEY:?Set AUTH_SECRET or the existing HOUSE_OPS_SECRET_KEY}}
  AUTH_URL: https://casa.bordarteuniformes.com.ar
  DOCUMENT_STORE_PATH: /data/shared-documents
  LEGACY_DOCUMENT_ROOT: ${HOUSE_OPS_LEGACY_DOCUMENT_ROOT:-/data/bronze/gmail}
  NODE_ENV: production
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *logging
  web:
    image: ${HOME_LAB_IMAGE:?Set an immutable image}
    # Preserve the existing data directory ownership and original PDFs.
    user: "${HOME_LAB_HOST_UID:-1000}:${HOME_LAB_HOST_GID:-1000}"
    environment: *app-environment
    ports:
      - "${HOME_LAB_PROD_BIND:-127.0.0.1}:${HOME_LAB_PROD_PORT:-8501}:8000"
    volumes:
      - ${HOME_LAB_PROD_DATA_DIR:?Set the existing data directory}:/data:rw
    networks:
      backend: {}
      frontend:
        aliases: [house-ops-web]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:uid=${HOME_LAB_HOST_UID:-1000},gid=${HOME_LAB_HOST_GID:-1000},mode=0750
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
  migrate:
    image: ${HOME_LAB_IMAGE:?Set an immutable image}
    profiles: [ops]
    user: "${HOME_LAB_HOST_UID:-1000}:${HOME_LAB_HOST_GID:-1000}"
    environment:
      <<: *app-environment
      HOUSE_OPS_ADMIN_PASSWORD: ${HOUSE_OPS_ADMIN_PASSWORD:-}
      HOUSE_OPS_SECOND_PASSWORD: ${HOUSE_OPS_SECOND_PASSWORD:-}
    command:
      [
        "sh",
        "-ec",
        "npm run db:migrate && npm run import:legacy && npm run db:seed",
      ]
    volumes:
      - ${HOME_LAB_PROD_DATA_DIR:?Set the existing data directory}:/data:rw
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:uid=${HOME_LAB_HOST_UID:-1000},gid=${HOME_LAB_HOST_GID:-1000},mode=0750
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
volumes:
  prod_postgres_data:
    name: home-lab-prod-postgres-data
networks:
  backend:
    name: home-lab-prod-backend
    internal: true
  frontend:
    name: home-lab-prod-frontend
