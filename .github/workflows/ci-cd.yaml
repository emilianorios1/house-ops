name: CI/CD
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: "Read-only readiness or approved deployment"
        type: choice
        options: [preflight, deploy, upload-session, handoff]
        default: preflight
      handoff_sha256:
        description: "SHA-256 of the optional private household bundle"
        type: string
        required: false
      upload_public_key:
        description: "Public RSA key for an encrypted temporary upload session"
        type: string
        required: false
      diagnostic_image:
        description: "Optional already published image for read-only import diagnostics"
        type: string
        required: false
      deploy_image:
        description: "Optional immutable image already validated by CI, for an operator-only retry"
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: house-ops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  preflight:
    name: Read-only VPS readiness
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'preflight' || github.ref != 'refs/heads/main')
    runs-on: [self-hosted, linux, x64, vps-production]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: bash scripts/preflight-production.sh
      - name: Read-only legacy document diagnostics
        if: inputs.diagnostic_image != ''
        env:
          DIAGNOSTIC_IMAGE: ${{ inputs.diagnostic_image }}
        run: bash scripts/diagnose-production-import.sh "$DIAGNOSTIC_IMAGE"
  verify:
    if: github.event_name != 'workflow_dispatch' || (inputs.operation == 'deploy' && inputs.deploy_image == '')
    # Preserve the required main-branch check context; verification now uses Next.js.
    name: Tests, dbt and image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://house_ops:ci-only-password@localhost:5432/house_ops
      TEST_DATABASE_URL: postgresql://house_ops:ci-only-password@localhost:5432/house_ops_tests
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      AUTH_URL: http://localhost:3000
      HOUSE_OPS_ADMIN_PASSWORD: ci-only-emiliano-password
      HOUSE_OPS_SECOND_PASSWORD: ci-only-vitoria-password
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: house_ops
          POSTGRES_USER: house_ops
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U house_ops -d house_ops" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run db:generate && npm run db:migrate && npm run db:seed
      - run: npm run typecheck && npm test && npm run test:integration && node --import tsx scripts/handoff-test.ts && npm audit --omit=dev
      - name: Validate scripts and configurations
        run: |
          bash -n scripts/init-worktree.sh scripts/dev-up.sh scripts/deploy-production.sh scripts/preflight-production.sh scripts/load-production-handoff.sh scripts/backup-production.sh
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.production.example -f compose.production.yaml config --quiet
          git diff --check
      - run: npm run build
      - name: Browser smoke (desktop and mobile)
        run: |
          npx playwright install --with-deps chromium
          E2E_CHANNEL=chromium npm run test:e2e
      - run: docker build --tag house-ops:ci .
      - run: bash scripts/test-handoff-stream.sh house-ops:ci
  publish:
    name: Publish immutable Next.js image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || (inputs.operation == 'deploy' && inputs.deploy_image == ''))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
  deploy:
    name: Approved VPS cutover
    # Merging this migration PR does not change the public service automatically.
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'deploy' && (needs.publish.result == 'success' || inputs.deploy_image != '')
    needs: publish
    runs-on: [self-hosted, linux, x64, vps-production]
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: test "$(hostname -s)" = bordarte
      - run: bash scripts/preflight-production.sh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy the verified immutable image
        env:
          DEPLOY_IMAGE: ${{ inputs.deploy_image || format('{0}@{1}', needs.publish.outputs.image, needs.publish.outputs.digest) }}
        run: |
          [[ "$DEPLOY_IMAGE" =~ ^ghcr.io/emilianorios1/house-ops@sha256:[a-f0-9]{64}$ ]]
          sudo -n ./scripts/deploy-production.sh "$DEPLOY_IMAGE"
  upload-session:
    name: Encrypted temporary upload session
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'upload-session'
    runs-on: [self-hosted, linux, x64, vps-production]
    environment: production
    timeout-minutes: 5
    steps:
      - name: Create encrypted envelope inside the existing app
        env:
          UPLOAD_PUBLIC_KEY: ${{ inputs.upload_public_key }}
        run: |
          test "$(hostname -s)" = bordarte
          web="$(docker ps -q --filter label=com.docker.compose.project=home-lab-prod --filter label=com.docker.compose.service=web)"
          test -n "$web"
          umask 077
          docker exec -e UPLOAD_PUBLIC_KEY "$web" node scripts/create-upload-session.mjs > "$RUNNER_TEMP/casa-upload-session.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: casa-upload-session-${{ github.run_id }}
          path: ${{ runner.temp }}/casa-upload-session.json
          retention-days: 1
      - name: Remove encrypted staging envelope
        if: always()
        run: rm -f -- "$RUNNER_TEMP/casa-upload-session.json"
  handoff:
    name: Load explicitly supplied household records
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'handoff'
    runs-on: [self-hosted, linux, x64, vps-production]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Receive private household bundle
        env:
          HANDOFF_SHA256: ${{ inputs.handoff_sha256 }}
          HOUSE_OPS_HANDOFF_01: ${{ secrets.HOUSE_OPS_HANDOFF_01 }}
          HOUSE_OPS_HANDOFF_02: ${{ secrets.HOUSE_OPS_HANDOFF_02 }}
          HOUSE_OPS_HANDOFF_03: ${{ secrets.HOUSE_OPS_HANDOFF_03 }}
          HOUSE_OPS_HANDOFF_04: ${{ secrets.HOUSE_OPS_HANDOFF_04 }}
          HOUSE_OPS_HANDOFF_05: ${{ secrets.HOUSE_OPS_HANDOFF_05 }}
          HOUSE_OPS_HANDOFF_06: ${{ secrets.HOUSE_OPS_HANDOFF_06 }}
          HOUSE_OPS_HANDOFF_07: ${{ secrets.HOUSE_OPS_HANDOFF_07 }}
          HOUSE_OPS_HANDOFF_08: ${{ secrets.HOUSE_OPS_HANDOFF_08 }}
          HOUSE_OPS_HANDOFF_09: ${{ secrets.HOUSE_OPS_HANDOFF_09 }}
          HOUSE_OPS_HANDOFF_10: ${{ secrets.HOUSE_OPS_HANDOFF_10 }}
          HOUSE_OPS_HANDOFF_11: ${{ secrets.HOUSE_OPS_HANDOFF_11 }}
          HOUSE_OPS_HANDOFF_12: ${{ secrets.HOUSE_OPS_HANDOFF_12 }}
          HOUSE_OPS_HANDOFF_13: ${{ secrets.HOUSE_OPS_HANDOFF_13 }}
          HOUSE_OPS_HANDOFF_14: ${{ secrets.HOUSE_OPS_HANDOFF_14 }}
          HOUSE_OPS_HANDOFF_15: ${{ secrets.HOUSE_OPS_HANDOFF_15 }}
          HOUSE_OPS_HANDOFF_16: ${{ secrets.HOUSE_OPS_HANDOFF_16 }}
          HOUSE_OPS_HANDOFF_17: ${{ secrets.HOUSE_OPS_HANDOFF_17 }}
          HOUSE_OPS_HANDOFF_18: ${{ secrets.HOUSE_OPS_HANDOFF_18 }}
          HOUSE_OPS_HANDOFF_19: ${{ secrets.HOUSE_OPS_HANDOFF_19 }}
          HOUSE_OPS_HANDOFF_20: ${{ secrets.HOUSE_OPS_HANDOFF_20 }}
        run: python3 scripts/receive-handoff.py "$RUNNER_TEMP/casa-handoff-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Load household records and verify public PDFs
        run: bash scripts/load-production-handoff.sh "$RUNNER_TEMP/casa-handoff-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Remove private staging files
        if: always() && inputs.handoff_sha256 != ''
        run: python3 scripts/receive-handoff.py --cleanup "$RUNNER_TEMP/casa-handoff-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
