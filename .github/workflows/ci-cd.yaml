name: CI/CD
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: house-ops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    name: TypeScript, expenses, migration and browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://house_ops:ci-only-password@localhost:5432/house_ops
      TEST_DATABASE_URL: postgresql://house_ops:ci-only-password@localhost:5432/house_ops_tests
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      AUTH_URL: http://localhost:3000
      HOUSE_OPS_ADMIN_PASSWORD: ci-only-emiliano-password
      HOUSE_OPS_SECOND_PASSWORD: ci-only-vitoria-password
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: house_ops
          POSTGRES_USER: house_ops
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U house_ops -d house_ops" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run db:generate && npm run db:migrate && npm run db:seed
      - run: npm run typecheck && npm test && npm run test:integration && npm audit --omit=dev
      - name: Validate scripts and configurations
        run: |
          bash -n scripts/init-worktree.sh scripts/dev-up.sh scripts/deploy-production.sh
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.production.example -f compose.production.yaml config --quiet
          git diff --check
      - run: npm run build
      - name: Browser smoke (desktop and mobile)
        run: |
          npx playwright install --with-deps chromium
          E2E_CHANNEL=chromium npm run test:e2e
      - run: docker build --tag house-ops:ci .
  publish:
    name: Publish immutable Next.js image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
  deploy:
    name: Approved VPS cutover
    # Merging this migration PR does not change the public service automatically.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: [self-hosted, linux, x64, vps-production]
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: test "$(hostname -s)" = bordarte
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo -n ./scripts/deploy-production.sh '${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}'
