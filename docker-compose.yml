services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-house_ops}
      POSTGRES_USER: ${POSTGRES_USER:-house_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set an isolated local password}
    ports:
      - "127.0.0.1:${HOME_LAB_DEV_POSTGRES_PORT:-55432}:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  web:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      DOCUMENT_STORE_PATH: /data/shared-documents
    ports:
      - "127.0.0.1:${HOUSE_OPS_DEV_WEB_PORT:-3000}:8000"
    volumes:
      - ./data/shared-documents:/data/shared-documents
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  dev_postgres_data:
